<div class="container">

    <h1>🎓 Student Grade Calculator</h1>

    <p>Calculate your average score and final letter grade.</p>


    <div class="grade-inputs">

        <input 
            type="text" 
            id="studentName" 
            placeholder="Enter student name"
        >


        <input 
            type="number" 
            id="grade1" 
            placeholder="Assignment 1 (0-100)"
        >


        <input 
            type="number" 
            id="grade2" 
            placeholder="Assignment 2 (0-100)"
        >


        <input 
            type="number" 
            id="grade3" 
            placeholder="Assignment 3 (0-100)"
        >

    </div>


    <button onclick="calculateGrade()">
        Calculate Grade
    </button>


    <h2 id="result"></h2>

</div>
